name: Deploy ABSInternational to DigitalOcean

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_IMAGE_NAME: absinternational-app
  DOCKER_IMAGE_TAG: ${{ secrets.DOCKER_HUB_USERNAME }}/absinternational-app:latest

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/absinternational-app:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/absinternational-app:buildcache,mode=max

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            mkdir -p ~/absinternational
            cd ~/absinternational

            cat << 'EOF' > docker-compose.yml
            version: '2.4'
            services:
              web:
                image: ${{ env.DOCKER_IMAGE_TAG }}
                container_name: absinternational-app
                restart: always
                mem_limit: 180m
                mem_reservation: 80m
                ports:
                  - "3002:3000"
                env_file:
                  - .env.local
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            EOF

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker-compose pull
            docker-compose down --remove-orphans
            docker rm -f absinternational-app
            docker-compose up -d
            docker image prune -f
